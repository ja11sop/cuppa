name: version

# Separate from the test matrix so labelling an open PR re-runs only this gate.
# create-pr adds impact:* after POST /pulls, so the initial opened event often has
# no labels yet; types: labeled covers that race without replaying integration.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  version:
    # Requires exactly one impact:<none|patch|minor|major> label on the pull request.
    # Apply it when opening the PR (create-pr --label impact:…) — not after the first CI failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install packaging
      - name: Fetch base branch
        run: git fetch --no-tags origin ${{ github.base_ref }}
      - name: Check version and changelog (needs impact label on PR)
        run: |
          python -m scripts.check_version_bump \
            --base-ref "origin/${{ github.base_ref }}" \
            --labels "${{ join(github.event.pull_request.labels.*.name, ',') }}"
