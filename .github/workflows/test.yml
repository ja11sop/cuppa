name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # requirements already provide runtime deps; avoid isolated build env
          pip install -e . --no-build-isolation
      - name: Lint
        run: |
          flake8 cuppa
          pylint -E cuppa
      - name: Unit tests
        run: pytest -m unit -q

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Smoke the full integration suite once per Linux toolchain family.
        # MSVC (`vc`) requires Windows + Visual Studio and is not exercised here.
        toolchain: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang gcovr
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-build-isolation
      - name: Integration tests (${{ matrix.toolchain }})
        env:
          CUPPA_TEST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: pytest -m integration -q

  integration-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Prefer a version with broad Windows wheels for native deps (lxml, libsass).
          python-version: '3.12'
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-build-isolation
      - name: Integration tests (vc)
        env:
          CUPPA_TEST_TOOLCHAIN: vc
        run: pytest -m integration -q
