name: documentation

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docs/**'
      - 'scripts/docs_*.py'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:
  # Publish creates the GitHub Release with GITHUB_TOKEN, which does not
  # start other workflows on `release: published`. release.yml calls this
  # workflow after the tag exists.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps for docs helpers
        run: pip install lxml

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Generate Antora site and agent Markdown
        working-directory: docs
        run: npm run build:site:all
        env:
          SITE_SEARCH_PROVIDER: lunr

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _docs_build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
