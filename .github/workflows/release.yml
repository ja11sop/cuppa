name: release

# Prepare or publish a cuppa release from the Actions UI (preferred), or from a git tag push.
#
# Once (Trusted Publishing):
# 1. Environment `pypi` with required reviewers.
# 2. PyPI trusted publisher: ja11sop / cuppa / release.yml / environment pypi.
#
# Each release (happy path — no local git tags):
# 1. Actions → release → Run workflow → action **prepare** → merge the PR CI opens.
# 2. Actions → release → Run workflow → action **publish** (leave tag blank) → approve `pypi`.
#
# Re-run or escape hatch: publish with tag=vX.Y.Z, or `git push origin vX.Y.Z`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      action:
        description: 'prepare = finish_release PR on master; publish = GitHub Release + PyPI'
        required: true
        type: choice
        options:
          - prepare
          - publish
        default: publish
      tag:
        description: 'publish only — existing tag to re-run (e.g. v1.4.0). Leave blank to publish current master.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install packaging
      - name: Finish release on a branch and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < cuppa/VERSION)"
          case "$VERSION" in
            *.dev) ;;
            *)
              echo "cuppa/VERSION is [$VERSION] (already a release). Open the next cycle with start_release before prepare." >&2
              exit 1
              ;;
          esac

          python -m scripts.finish_release
          RELEASE_VERSION="$(tr -d '[:space:]' < cuppa/VERSION)"
          BRANCH="release_${RELEASE_VERSION//./_}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add cuppa/VERSION CHANGELOG.md
          git commit -m "Release ${RELEASE_VERSION}"
          git push -u origin "HEAD:${BRANCH}" --force

          BODY="$(cat <<EOF
          ## Summary
          - Close the ${RELEASE_VERSION} cycle (\`finish_release\` via Actions **prepare**).

          ## After merge
          1. Actions → **release** → Run workflow → action **publish** (leave tag blank).
          2. Approve the \`pypi\` environment when asked.

          ## Test plan
          - [ ] CI green on this PR
          - [ ] After merge: publish workflow from master tip
          EOF
          )"
          # Strip leading spaces from the heredoc for readable markdown.
          BODY="$(printf '%s\n' "$BODY" | sed 's/^          //')"

          EXISTING="$(gh pr list --head "$BRANCH" --base master --state open --json url --jq '.[0].url // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Pull request already open: $EXISTING"
            exit 0
          fi
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Release ${RELEASE_VERSION}" \
            --body "$BODY" \
            --label impact:none

  resolve:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
      ref: ${{ steps.set.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
            REF="$TAG"
          elif [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
            REF="$TAG"
          else
            VERSION="$(tr -d '[:space:]' < cuppa/VERSION)"
            case "$VERSION" in
              *.dev)
                echo "cuppa/VERSION is still [$VERSION]. Run prepare, merge that PR, then publish." >&2
                exit 1
                ;;
            esac
            TAG="v${VERSION}"
            REF="master"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "tag must look like v1.4.0, got: $TAG" >&2
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  gate:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install packaging
      - name: Check release
        run: python -m scripts.check_release --tag "${{ needs.resolve.outputs.tag }}"
      - name: Refuse a tag that points at the wrong commit
        if: needs.resolve.outputs.ref == 'master'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | awk 'END {print $1}')"
          if [ -n "${REMOTE:-}" ] && [ "$REMOTE" != "$HEAD" ]; then
            echo "Tag ${TAG} already exists at ${REMOTE}, but master is ${HEAD}." >&2
            echo "Delete the bad tag (git push origin :refs/tags/${TAG}) and re-run publish." >&2
            exit 1
          fi

  build:
    needs: [ resolve, gate ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: pip install build packaging
      - name: Build sdist and wheel
        run: python -m build
      - name: Write release notes
        run: |
          python -m scripts.release_notes \
            --tag "${{ needs.resolve.outputs.tag }}" \
            -o release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            release-notes.md

  github-release:
    needs: [ resolve, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Resolve commit to tag
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: cuppa ${{ needs.resolve.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          target_commitish: ${{ steps.head.outputs.sha }}
          # New tags via the API do not re-trigger this workflow's push:tags path.
          make_latest: true

  # GITHUB_TOKEN-created releases do not fire docs.yml's `release: published`.
  documentation:
    needs: github-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  pypi:
    needs: [ resolve, build, github-release ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cuppa/${{ needs.resolve.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
