site:
  title: Cuppa Documentation
  url: https://ja11sop.github.io/cuppa
  start_page: cuppa::index.adoc
content:
  sources:
  - url: ./..
    start_path: docs
    branches: HEAD
    worktrees: true
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui
antora:
  extensions:
  - require: '@antora/lunr-extension'
    index_latest_only: true
  - require: '@sntke/antora-mermaid-extension'
    mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs
    script_stem: header-scripts
    mermaid_initialize_options:
      start_on_load: true
    mermaid_run_options:
      query_selector: '.mermaid'
asciidoc:
  attributes:
    experimental: ''
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
    cpp: C++
    plus: +
output:
  dir: ./../_docs_build/site
runtime:
  cache_dir: ./../_docs_build/antora-cache
